<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verdikt</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="" type="image/x-icon">
    <script src="Java.js" defer></script>
</head>
<body>
    <nav>
        <div class="search-container">
            <input type="text" id="search-input" placeholder="Search reviews, shows, or users..."  aria-label="Search reviews">
        </div>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="categories.html">Reviews</a></li>
            <li><a href="about.html">About</a></li>
        </ul>

        <button id="theme-toggle" class="theme-btn">
            <span id="theme-icon" aria-hidden="true">🌙</span>
            <span id="theme-text">Dark Mode</span>
        </button>
    </nav>
    <header>
        <h1>Contact Us</h1>
        <h3>Have questions or feedback? We'd love to hear from you!</h3>
        <h3>Get in touch with our team and let us know how we can improve your experience.</h3>
    </header>

    <section>
        <h1 style="text-align: center;">Contact Form</h1>
        <form id="contact-form">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>

            <label for="message">Message:</label>
            <textarea id="message" name="message" rows="5" required></textarea>

            <button type="submit">Submit</button>
        </form>
    </section>
</body>
</html>
